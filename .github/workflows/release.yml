name: Android Fastlane Release

on:
  push:
    branches:
      - fastlane_test

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

            # Run Fastlane, passing the variables directly into its environment
      - name: Execute Fastlane
        working-directory: android
        run: |
          bundle install
          
          # This temporary debug script checks if the string is empty without printing the secret
          if [ -z "$PLAY_STORE_CONFIG_JSON" ]; then
            echo "❌ ERROR: PLAY_STORE_CONFIG_JSON secret is empty or missing in GitHub Secrets!"
            exit 1
          else
            echo "✅ Secret found! Length: ${#PLAY_STORE_CONFIG_JSON} characters."
          fi

          bundle exec fastlane test_google_json
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
