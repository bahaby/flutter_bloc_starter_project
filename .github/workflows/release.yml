name: Android Fastlane Release

on:
  push:
    branches:
      - fastlane_test
      

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      # Native shell command to place the keystore file into the workspace securely
      - name: Reconstruct Keystore File
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      - name: Create key.properties File
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=my-release-key.jks" >> android/key.properties

      - name: Install Project Dependencies
        run: flutter pub get
      # Run all code generation tools (one-time build execution)
      - name: Run Build Runner Code Generation (Freezed, JSON, Slang)
        run: |
          dart run build_runner build -d
          dart run slang

      # Generate visual branding assets (Icons & Splash Screen)
      - name: Generate Visual Branding Assets
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      # Dynamically update App Name and Package ID configuration
      - name: Rename Package Configuration
        run: dart run package_rename
      # Parse the version name from pubspec.yaml and inject it into the environment for Fastlane
      - name: Parse Local Version Name from pubspec.yaml
        id: parse_version
        run: |
          # Grabs the "version: X.Y.Z+A" line, strips spaces/prefixes, and splits everything before the "+"
          VERSION_NAME=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # Run Fastlane, passing the variables directly into its environment
      - name: Execute Fastlane
        run: |
          bundle install
          bundle exec fastlane beta_github
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
          VERSION_NAME: ${{ steps.parse_version.outputs.version_name }}
