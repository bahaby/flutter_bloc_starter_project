name: Android Fastlane Release

on:
  push:
    branches:
      - fastlane_test

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      # Native shell command to place the keystore file into the workspace securely
      - name: Reconstruct Keystore File
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      - name: Install Project Dependencies
        run: flutter pub get
        
      # Run Fastlane, passing the variables directly into its environment
      - name: Execute Fastlane
        working-directory: android
        run: |
          bundle install
          bundle exec fastlane beta_github
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
