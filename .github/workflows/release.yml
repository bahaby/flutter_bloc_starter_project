name: Android Fastlane Release

on:
  push:
    branches:
      - fastlane_test

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      # Native shell command to place the keystore file into the workspace securely
      - name: Reconstruct Keystore File
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      - name: Install Project Dependencies
        run: flutter pub get
      # Run all code generation tools (one-time build execution)
      - name: Run Build Runner Code Generation (Freezed, JSON, Slang)
        run: |
          dart run build_runner build -d

      # Generate visual branding assets (Icons & Splash Screen)
      - name: Generate Visual Branding Assets
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      # Dynamically update App Name and Package ID configuration
      - name: Rename Package Configuration
        run: dart run package_rename

      # Run Fastlane, passing the variables directly into its environment
      - name: Execute Fastlane
        working-directory: android
        run: |
          bundle install
          bundle exec fastlane beta_github
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
